name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach binaries to a release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, label: windows-x64, artifact: cvd.exe}
          - {os: ubuntu-22.04, label: linux-x64, artifact: cvd}
          - {os: macos-latest, label: macos-arm64, artifact: cvd}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify the tests pass before shipping a binary
        run: python -m unittest discover -q

      - name: Build
        run: pyinstaller cvd.spec

      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.artifact }}"
          test -f "$BIN"
          "$BIN" --version
          "$BIN" --list > /dev/null
          "$BIN" --example-cnv demo.tsv
          "$BIN" --cnv demo.tsv --out out > /dev/null
          test -f out/demo_aneuploidy.txt
          "$BIN" --gene TP53 --out out > /dev/null
          test -f out/pLV-EF1a_TP53.gb
          "$BIN" --gene TP53 --setting "in vivo" --rank --out out > /dev/null
          test -f out/TP53_rep_vector_options.txt
          echo "binary works: $("$BIN" --version)"

      - name: Name the artifact per platform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          cp "dist/${{ matrix.artifact }}" "upload/cvd-${{ matrix.label }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          ls -l upload

      - uses: actions/upload-artifact@v4
        with:
          name: cvd-${{ matrix.label }}
          path: upload/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" upload/* --clobber --repo "${GITHUB_REPOSITORY}"
