[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cvd"
version = "1.1.0"
description = "Cancer gene therapy viral vector designer with arm-level aneuploidy analysis"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["bioinformatics", "gene-therapy", "viral-vector", "genbank", "copy-number",
            "aneuploidy", "oncology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Runtime dependencies: none.  The tool is standard library only; tkinter ships with
# CPython on Windows and macOS and is python3-tk on Debian/Ubuntu.
dependencies = []

[project.optional-dependencies]
# Only needed to build a stand-alone executable; see .github/workflows/release.yml
build = ["pyinstaller>=6.0"]

[project.scripts]
cvd = "cvd.cli.run:main"

[tool.setuptools.packages.find]
include = ["cvd*"]
